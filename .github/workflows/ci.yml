name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Backend · lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff, zero findings allowed)
        run: ruff check . && ruff format --check kavach tests
      - name: API tests
        run: pytest

  web:
    name: Web app · story engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
