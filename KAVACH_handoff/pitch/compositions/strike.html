<template>
  <style>
    
@font-face { font-family: KSans; src: local('Segoe UI'); font-weight: 400; }
@font-face { font-family: KSans; src: local('Segoe UI Semibold'); font-weight: 600; }
@font-face { font-family: KMono; src: local('Consolas'); font-weight: 400; }
#root { position: absolute; inset: 0; overflow: hidden; font-family: KSans, sans-serif; color: #171717;
        background: radial-gradient(ellipse 70% 75% at 50% 45%, #F4F4F5 0%, #E4E4E6 60%, #C9C9CC 100%); }
#root * { box-sizing: border-box; }
#root .abs { position: absolute; }
#root .card { background: #19191B; border: 1px solid #2C2C2F; border-radius: 24px; color: #EDEDED;
              box-shadow: 0 24px 48px rgba(0,0,0,0.14); }
#root .row { background: #232325; border-radius: 14px; color: #EDEDED; }
#root .mono { font-family: KMono, monospace; font-variant-numeric: tabular-nums; }
#root .semi { font-weight: 600; }
#root .t2 { color: #525252; } #root .t3 { color: #737373; }
#root .c2 { color: #A1A1A6; } #root .c3 { color: #85858B; }
#root .red { color: #E5484D; } #root .green { color: #4CC38A; } #root .amber { color: #F5A524; }
#root .indigo { color: #2A2FD0; } #root .indigo-d { color: #6C70F0; }
#root .dot { display: inline-block; width: 16px; height: 16px; border-radius: 8px; flex: none; }
#root .head { left: 120px; top: 84px; font-size: 40px; }
#root i[data-sfx] { display: none; }

    /* one grid, one 32px gap: scam -> decoy -> what it extracts, report underneath */
    #st-grid { left: 120px; top: 240px; display: grid; grid-template-columns: 440px 120px 560px 480px;
               grid-template-rows: auto auto; column-gap: 0; row-gap: 32px; }
    #st-scam { grid-column: 1; grid-row: 1; align-self: center; padding: 36px 44px; }
    .st-n { font-size: 40px; white-space: nowrap; } .st-s { font-size: 30px; margin-top: 8px; white-space: nowrap; }
    #st-line { grid-column: 2; grid-row: 1; align-self: center; height: 4px; background: #E5484D; transform-origin: left center; }
    #st-decoy { grid-column: 3; grid-row: 1; padding: 36px 44px; margin-right: 32px; display: flex; flex-direction: column; justify-content: space-between; }
    #st-wave { display: flex; align-items: center; gap: 7px; height: 90px; }
    .st-b { width: 9px; height: 80px; border-radius: 5px; background: #A1A1A6; }
    #st-x { grid-column: 4; grid-row: 1; display: flex; flex-direction: column; gap: 32px; }
    .st-row { padding: 24px 32px; }
    .st-k { font-size: 28px; } .st-v { font-size: 34px; margin-top: 6px; white-space: nowrap; }
    #st-report { grid-column: 3 / 5; grid-row: 2; padding: 32px 44px; display: flex; align-items: center; justify-content: space-between; }
  </style>
  <div id="root" data-composition-id="strike" data-width="1920" data-height="1080">
    <div class="abs head"><span class="indigo semi">Strike</span> <span class="t2">· fights back</span></div>
    <div id="st-grid" class="abs">
    <div id="st-scam" class="card"><div class="st-n mono red">+91 98XXX XX210</div><div class="st-s c2">scam call, forwarded</div></div>
    <div id="st-line"></div>
    <div id="st-decoy" class="card">
      <div><div class="st-n">Decoy AI retiree</div><div class="st-s c2">fake name, bank and address</div></div>
      <div id="st-wave"></div>
      <div class="st-s c2">talking for <span id="st-min" class="mono" style="color:#EDEDED">00:00</span></div>
    </div>
    <div id="st-x">
      <div id="st-x0" class="card st-row"><div class="st-k c3">UPI ID</div><div class="st-v mono">refund.cbi@ok····</div></div>
      <div id="st-x1" class="card st-row"><div class="st-k c3">Mule account</div><div class="st-v mono">HDFC ····4471</div></div>
      <div id="st-x2" class="card st-row"><div class="st-k c3">Second number</div><div class="st-v mono">+91 70XXX XX451</div></div>
    </div>
    <div id="st-report" class="card">
      <div><div class="st-n">Reports drafted</div><div class="st-s c2">Sanchar Saathi Chakshu · bank</div></div>
      <div class="st-s"><span class="dot" style="background:#F5A524"></span> <span class="amber">needs Rahul's approval</span></div>
    </div>
    </div>
    <i data-sfx="minimize_004.ogg" data-at="3.79" data-vol="0.3"></i>
    <i data-sfx="pluck_002.ogg" data-at="9.95" data-vol="0.4"></i>
    <i data-sfx="pluck_002.ogg" data-at="10.90" data-vol="0.4"></i>
    <i data-sfx="pluck_002.ogg" data-at="11.15" data-vol="0.35"></i>
    <i data-sfx="select_003.ogg" data-at="12.31" data-vol="0.4"></i>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const IN = (s, t, d = 0.55) => tl.fromTo(s, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: d, ease: "expo.out" }, t);
    const OUT = (s, t) => tl.to(s, { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power3.in" }, t);
    ["#st-scam", "#st-decoy", "#st-x0", "#st-x1", "#st-x2", "#st-report"].forEach((s) => gsap.set(s, { opacity: 0 }));
    gsap.set("#st-line", { scaleX: 0 });
    const wave = document.getElementById("st-wave"), bars = [];
    for (let i = 0; i < 44; i++) { const b = document.createElement("div"); b.className = "st-b"; wave.appendChild(b); bars.push(b); }

    IN("#st-scam", 2.99 - 0.2);
    tl.to("#st-line", { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 3.79);
    tl.fromTo("#st-decoy", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.7, ease: "expo.out" }, 4.39 - 0.1);
    // the decoy keeps talking: bar heights are a pure function of scene time
    const talk = { t: 0 };
    tl.to(talk, { t: 1, duration: 15.40 - 4.39, ease: "none", onUpdate: () => {
      const s = talk.t * (15.40 - 4.39);
      bars.forEach((b, i) => { b.style.transform = "scaleY(" + (0.15 + 0.85 * Math.abs(Math.sin(s * 7 + i * 0.55) * Math.cos(s * 2.3 + i * 0.21))) + ")"; });
      const m = Math.floor(s * 23);  // the call clock runs fast: minutes of a scammer's time
      document.getElementById("st-min").textContent = String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
    } }, 4.39);
    [["#st-x0", 9.95], ["#st-x1", 10.90], ["#st-x2", 11.15 + 0.4]].forEach(([s, t]) =>
      tl.fromTo(s, { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "expo.out" }, t - 0.1));
    tl.fromTo("#st-report", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 12.31 - 0.1);
    OUT(["#st-scam", "#st-line", "#st-decoy", "#st-x", "#st-report"], 15.40 - 0.4);
    window.__timelines["strike"] = tl;
  </script>
</template>
