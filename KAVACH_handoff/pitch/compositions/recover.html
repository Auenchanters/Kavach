<template>
  <style>
    
@font-face { font-family: KSans; src: local('Segoe UI'); font-weight: 400; }
@font-face { font-family: KSans; src: local('Segoe UI Semibold'); font-weight: 600; }
@font-face { font-family: KMono; src: local('Consolas'); font-weight: 400; }
#root { position: absolute; inset: 0; overflow: hidden; font-family: KSans, sans-serif; color: #171717;
        background: radial-gradient(ellipse 70% 75% at 50% 45%, #F4F4F5 0%, #E4E4E6 60%, #C9C9CC 100%); }
#root * { box-sizing: border-box; }
#root .abs { position: absolute; }
#root .card { background: #19191B; border: 1px solid #2C2C2F; border-radius: 24px; color: #EDEDED;
              box-shadow: 0 24px 48px rgba(0,0,0,0.14); }
#root .row { background: #232325; border-radius: 14px; color: #EDEDED; }
#root .mono { font-family: KMono, monospace; font-variant-numeric: tabular-nums; }
#root .semi { font-weight: 600; }
#root .t2 { color: #525252; } #root .t3 { color: #737373; }
#root .c2 { color: #A1A1A6; } #root .c3 { color: #85858B; }
#root .red { color: #E5484D; } #root .green { color: #4CC38A; } #root .amber { color: #F5A524; }
#root .indigo { color: #2A2FD0; } #root .indigo-d { color: #6C70F0; }
#root .dot { display: inline-block; width: 16px; height: 16px; border-radius: 8px; flex: none; }
#root .head { left: 120px; top: 84px; font-size: 40px; }
#root i[data-sfx] { display: none; }

    #rc-clock { right: 120px; top: 74px; text-align: right; }
    #rc-clock-n { font-size: 64px; color: #171717; }
    #rc-clock-l { font-size: 30px; }
    /* two columns, one 32px rhythm; the connectors are drawn from the measured layout */
    #rc-left { left: 120px; top: 518px; width: 620px; transform: translateY(-50%); display: flex; flex-direction: column; gap: 32px; }
    #rc-right { left: 1000px; top: 230px; width: 800px; display: flex; flex-direction: column; gap: 32px; }
    #rc-sms { padding: 36px 44px; }
    .rc-t { font-size: 34px; line-height: 1.4; }
    #rc-btn { height: 120px; border-radius: 20px; background: #EDEDED; color: #171717;
              display: flex; align-items: center; justify-content: center; font-size: 42px; box-shadow: 0 24px 48px rgba(0,0,0,0.14); }
    #rc-lines { left: 740px; top: 0; width: 260px; height: 1080px; }
    .rc-lane { height: 120px; padding: 0 44px; display: flex; align-items: center; justify-content: space-between; }
    .rc-a { font-size: 38px; } .rc-s { font-size: 32px; }
    #rc-wait { font-size: 34px; display: flex; align-items: center; gap: 14px; padding-left: 44px; }
  </style>
  <div id="root" data-composition-id="recover" data-width="1920" data-height="1080">
    <div class="abs head"><span class="indigo semi">Recover</span> <span class="t2">· the golden hour</span></div>
    <div id="rc-clock" class="abs"><div id="rc-clock-n" class="mono">00:00:00</div><div id="rc-clock-l" class="t3">of the golden hour used</div></div>
    <div id="rc-left" class="abs">
    <div id="rc-sms" class="card">
      <div class="rc-t c2">SMS · HDFC Bank</div>
      <div class="rc-t" style="margin-top:12px"><span class="red semi">₹48,000</span> debited from A/c ····4471 via UPI. Not you? Call 1800 202 6161</div>
    </div>
    <div id="rc-btn" class="semi">I've been cheated</div>
    </div>
    <svg id="rc-lines" class="abs" viewBox="0 0 260 1080">
      <path id="rc-p0" stroke="#2A2FD0" stroke-width="4" fill="none" />
      <path id="rc-p1" stroke="#2A2FD0" stroke-width="4" fill="none" />
      <path id="rc-p2" stroke="#2A2FD0" stroke-width="4" fill="none" />
      <path id="rc-p3" stroke="#2A2FD0" stroke-width="4" fill="none" />
    </svg>
    <div id="rc-right" class="abs">
    <div id="rc-l0" class="card rc-lane"><div class="rc-a">Bank agent</div><div id="rc-s0" class="rc-s c2">block + hold requested</div></div>
    <div id="rc-l1" class="card rc-lane"><div class="rc-a">1930 agent</div><div id="rc-s1" class="rc-s c2">helpline briefing ready</div></div>
    <div id="rc-l2" class="card rc-lane"><div class="rc-a">Complaint agent</div><div id="rc-s2" class="rc-s c2">cybercrime.gov.in, pre-filled</div></div>
    <div id="rc-l3" class="card rc-lane"><div class="rc-a">Evidence agent</div><div id="rc-s3" class="rc-s c2">14 items, time-stamped</div></div>
    <div id="rc-wait"><span class="dot" style="background:#F5A524"></span><span class="t2">all four waiting on Rahul's one-tap approval</span></div>
    </div>
    <i data-sfx="error_005.ogg" data-at="4.59" data-vol="0.35"></i>
    <i data-sfx="click_001.ogg" data-at="3.95" data-vol="0.55"></i>
    <i data-sfx="minimize_002.ogg" data-at="5.75" data-vol="0.3"></i>
    <i data-sfx="tick_001.ogg" data-at="7.63" data-vol="0.35"></i>
    <i data-sfx="tick_001.ogg" data-at="8.99" data-vol="0.35"></i>
    <i data-sfx="tick_001.ogg" data-at="10.53" data-vol="0.35"></i>
    <i data-sfx="tick_001.ogg" data-at="12.59" data-vol="0.35"></i>
    <i data-sfx="confirmation_004.ogg" data-at="14.53" data-vol="0.4"></i>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const IN = (s, t, d = 0.55) => tl.fromTo(s, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: d, ease: "expo.out" }, t);
    const OUT = (s, t) => tl.to(s, { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power3.in" }, t);
    ["#rc-clock", "#rc-sms", "#rc-btn", "#rc-l0", "#rc-l1", "#rc-l2", "#rc-l3", "#rc-wait", "#rc-s0", "#rc-s1", "#rc-s2", "#rc-s3"].forEach((s) => gsap.set(s, { opacity: 0 }));
    // connectors: from the button's right edge to each lane's left edge, measured from the layout
    const R = document.getElementById("root").getBoundingClientRect(), k = R.height / 1080;  // preview may scale the stage
    const pageY = (e) => { const r = e.getBoundingClientRect(); return (r.top + r.height / 2 - R.top) / k; };
    const by = pageY(document.getElementById("rc-btn"));
    [0, 1, 2, 3].forEach((i) => { const ly = pageY(document.getElementById("rc-l" + i));
      document.getElementById("rc-p" + i).setAttribute("d", `M0 ${by} C130 ${by} 130 ${ly} 260 ${ly}`); });
    ["#rc-p0", "#rc-p1", "#rc-p2", "#rc-p3"].forEach((s) => gsap.set(s, { strokeDasharray: 1000, strokeDashoffset: 1000 }));

    IN("#rc-clock", 2.25 - 0.1);
    IN("#rc-sms", 4.59 - 0.4);
    IN("#rc-btn", 3.95 - 0.4);
    tl.to("#rc-btn", { scale: 0.97, duration: 0.08, ease: "power2.out" }, 3.95);
    tl.to("#rc-btn", { scale: 1, duration: 0.18, ease: "power2.out" }, 3.95 + 0.08);
    // the golden-hour clock starts on the tap and stops at 00:01:12 when everything is ready
    const clk = { v: 0 }, el = document.getElementById("rc-clock-n");
    tl.to(clk, { v: 72, duration: 14.53 - 3.95, ease: "none", onUpdate: () => {
      const s = Math.floor(clk.v); el.textContent = "00:" + String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
    } }, 3.95);
    // one tap, four agents in parallel
    tl.to(["#rc-p0", "#rc-p1", "#rc-p2", "#rc-p3"], { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 5.75);
    tl.fromTo(["#rc-l0", "#rc-l1", "#rc-l2", "#rc-l3"], { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "expo.out", stagger: 0.06 }, 6.75 - 0.2);
    [7.63, 8.99, 10.53, 12.59].forEach((t, i) => IN("#rc-s" + i, t - 0.1, 0.4));
    IN("#rc-wait", 14.53 - 0.1);
    OUT(["#rc-sms", "#rc-btn", "#rc-lines", "#rc-l0", "#rc-l1", "#rc-l2", "#rc-l3", "#rc-wait", "#rc-clock"], 16.94 - 0.4);
    window.__timelines["recover"] = tl;
  </script>
</template>
