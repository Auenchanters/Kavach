<template>
  <style>
    {{CSS}}
    #rm-map { left: 140px; top: 90px; width: 812px; height: 900px; }
    #rm-land { fill: #E4E4E6; stroke: #A1A1A6; stroke-width: 1.6; }
    .rm-mesh { stroke: #2A2FD0; stroke-opacity: 0.35; stroke-width: 2; }
    /* one column, one gap: cards and the closing line never touch */
    #rm-col { left: 1080px; top: 540px; width: 720px; transform: translateY(-50%); display: flex; flex-direction: column; gap: 32px; }
    #rm-steps { position: relative; display: flex; flex-direction: column; gap: 32px; }
    .rm-step { position: relative; padding: 36px 44px; }
    .rm-when { font-size: 30px; } .rm-what { font-size: 38px; line-height: 1.3; margin-top: 8px; }
    #rm-rail { left: -32px; top: 0; bottom: 0; width: 4px; background: #2A2FD0; transform-origin: top center; }
    #rm-free { font-size: 38px; display: flex; align-items: center; gap: 14px; padding-left: 44px; }
  </style>
  <div id="root" data-composition-id="roadmap" data-width="1920" data-height="1080">
    <!-- Natural Earth 1:10m, India point of view (public domain) -->
    <svg id="rm-map" class="abs" viewBox="0 0 {{INDIA_W}} {{INDIA_H}}"><path id="rm-land" d="{{INDIA_D}}" /><g id="rm-lines"></g><g id="rm-dots"></g></svg>
    <div id="rm-col" class="abs">
      <div id="rm-steps">
        <div id="rm-rail" class="abs"></div>
        <div id="rm-s0" class="card rm-step"><div class="rm-when c3 mono">Dec 2026</div><div class="rm-what">Hackathon prototype</div></div>
        <div id="rm-s1" class="card rm-step"><div class="rm-when c3 mono">Pilot</div><div class="rm-what">50 families · Android app · Exotel numbers</div></div>
        <div id="rm-s2" class="card rm-step"><div class="rm-when c3 mono">Scale</div><div class="rm-what">Banks and telecoms license the fraud graph · more Indian languages</div></div>
      </div>
      <div id="rm-free"><span class="dot" style="background:#4CC38A"></span><span class="t2">always free for families</span></div>
    </div>
    <i data-sfx="minimize_002.ogg" data-at="{{s6a:Next}}" data-vol="0.3"></i>
    <i data-sfx="pluck_002.ogg" data-at="{{s6a:50-family}}" data-vol="0.35"></i>
    <i data-sfx="pluck_002.ogg" data-at="{{s6a:bank}}" data-vol="0.35"></i>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const NS = "http://www.w3.org/2000/svg";
    const C = {{INDIA_CITIES}};
    const names = Object.keys(C);
    const dots = [], lines = [];
    // a protective mesh: each city links to its two nearest neighbours
    names.forEach((a) => {
      const near = names.filter((b) => b !== a).sort((p, q) => Math.hypot(C[p][0] - C[a][0], C[p][1] - C[a][1]) - Math.hypot(C[q][0] - C[a][0], C[q][1] - C[a][1])).slice(0, 2);
      near.forEach((b) => { if (a < b) { const l = document.createElementNS(NS, "line");
        l.setAttribute("x1", C[a][0]); l.setAttribute("y1", C[a][1]); l.setAttribute("x2", C[b][0]); l.setAttribute("y2", C[b][1]);
        l.setAttribute("class", "rm-mesh"); document.getElementById("rm-lines").appendChild(l); lines.push(l); } });
    });
    names.forEach((n) => { const d = document.createElementNS(NS, "rect");
      d.setAttribute("x", C[n][0] - 11); d.setAttribute("y", C[n][1] - 11); d.setAttribute("width", 22); d.setAttribute("height", 22);
      d.setAttribute("rx", 6); d.setAttribute("fill", "#2A2FD0"); document.getElementById("rm-dots").appendChild(d); dots.push(d); });
    ["#rm-s0", "#rm-s1", "#rm-s2", "#rm-free"].forEach((s) => gsap.set(s, { opacity: 0 }));
    gsap.set("#rm-rail", { scaleY: 0 });
    tl.fromTo("#rm-map", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.9, ease: "expo.out" }, 0.05);
    tl.fromTo(dots, { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.45, ease: "expo.out", stagger: 0.12 }, 0.4);
    tl.fromTo(lines, { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.05 }, {{s6a:license}} - 0.2);  // the graph licensed nationwide
    const step = (s, t) => tl.fromTo(s, { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "expo.out" }, t);
    step("#rm-s0", {{s6a:Next}} - 0.3);
    tl.to("#rm-rail", { scaleY: 1, duration: {{s6a:bank}} - {{s6a:Next}} + 0.4, ease: "power2.inOut" }, {{s6a:Next}});
    step("#rm-s1", {{s6a:50-family}} - 0.2);
    step("#rm-s2", {{s6a:bank}} - 0.2);
    tl.fromTo("#rm-free", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, {{s6a:free}} - 0.1);
    tl.to("#rm-map, #rm-rail, .rm-step, #rm-free", { opacity: 0, filter: "blur(6px)", duration: 0.35, ease: "power3.in" }, {{dur}} - 0.4);
    window.__timelines["roadmap"] = tl;
  </script>
</template>
