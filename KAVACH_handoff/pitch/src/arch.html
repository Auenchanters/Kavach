      tl.set(id, { opacity: 1 }, t);
      tl.fromTo(id, { y: 0 }, { y: b.top - a.bot, duration: 1.2, ease: "power2.inOut", immediateRender: false }, t);
      tl.set(id, { opacity: 0 }, t + 1.2); };

    cam(S3.top - 400, {{s4d}} - 0.4);
    gsap.set("#ar-direct", { opacity: 0 }); IN("#ar-direct", {{s4d:directly}} - 0.1, 0.4); OUT("#ar-direct", {{s4d:Policy}} - 0.2);
