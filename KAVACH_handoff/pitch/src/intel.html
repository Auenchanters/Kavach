<template>
  <style>
    {{CSS}}
    #in-g { left: 0; top: 0; width: 1920px; height: 1080px; }
    .in-e { stroke: #A1A1A6; stroke-width: 2; }
    .in-lab { font-size: 32px; }
    #in-k { left: 120px; top: 900px; display: flex; gap: 48px; font-size: 32px; }
    #in-k span { display: inline-flex; align-items: center; gap: 12px; }
    #in-ring-l { right: 120px; top: 898px; font-size: 32px; white-space: nowrap; }
    #in-fam-l { left: 120px; top: 170px; font-size: 40px; }
  </style>
  <div id="root" data-composition-id="intel" data-width="1920" data-height="1080">
    <div class="abs head"><span id="in-h0" class="indigo semi">Intelligence</span> <span id="in-h1" class="t2">· one shared fraud graph</span></div>
    <svg id="in-g" class="abs" viewBox="0 0 1920 1080"><g id="in-edges"></g><g id="in-nodes"></g><g id="in-fam"></g></svg>
    <div id="in-k" class="abs t2">
      <span><span class="dot" style="background:#19191B"></span>phone number</span>
      <span><span class="dot" style="background:#6C70F0;border-radius:3px"></span>UPI ID</span>
      <span><span class="dot" style="background:#A1A1A6"></span>URL</span>
    </div>
    <div id="in-ring-l" class="abs red semi">one scam ring, 9 numbers, 2 mule accounts</div>
    <div id="in-fam-l" class="abs t2">each report warns every family on KAVACH</div>
    <i data-sfx="tick_001.ogg" data-at="{{s3h:number}}" data-vol="0.3"></i>
    <i data-sfx="tick_001.ogg" data-at="{{s3h:URL}}" data-vol="0.3"></i>
    <i data-sfx="tick_001.ogg" data-at="{{s3h:UPI}}" data-vol="0.3"></i>
    <i data-sfx="error_005.ogg" data-at="{{s3h:rings}}" data-vol="0.3"></i>
    <i data-sfx="glass_004.ogg" data-at="{{s3h:protects}}" data-vol="0.3"></i>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const NS = "http://www.w3.org/2000/svg";
    let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };  // seeded, deterministic
    const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); document.getElementById(parent).appendChild(e); return e; };
    // nodes: three kinds, one tight ring on the right
    const nodes = [];
    const add = (x, y, kind, ring) => nodes.push({ x, y, kind, ring });
    for (let i = 0; i < 26; i++) add(160 + rnd() * 1000, 260 + rnd() * 560, ["phone", "phone", "url", "upi"][i % 4], false);
    for (let i = 0; i < 9; i++) { const a = i / 9 * Math.PI * 2; add(1500 + Math.cos(a) * 190, 560 + Math.sin(a) * 190, "phone", true); }
    add(1500, 500, "upi", true); add(1500, 620, "upi", true);
    const edges = [];
    nodes.forEach((n, i) => { if (n.ring) { edges.push([i, n.y < 560 ? 35 : 36, true]); } });
    for (let i = 0; i < 30; i++) { const a = Math.floor(rnd() * 26), b = Math.floor(rnd() * 26); if (a !== b) edges.push([a, b, false]); }
    for (let i = 0; i < 4; i++) edges.push([Math.floor(rnd() * 26), 26 + i * 2, false]);
    const eEls = edges.map(([a, b, r]) => ({ r, el: mk("line", { x1: nodes[a].x, y1: nodes[a].y, x2: nodes[b].x, y2: nodes[b].y, class: "in-e" }, "in-edges") }));
    const nEls = nodes.map((n) => n.kind === "upi"
      ? mk("rect", { x: n.x - 13, y: n.y - 13, width: 26, height: 26, rx: 5, fill: "#6C70F0" }, "in-nodes")
      : mk("circle", { cx: n.x, cy: n.y, r: n.ring ? 15 : 13, fill: n.kind === "url" ? "#A1A1A6" : "#19191B" }, "in-nodes"));
    const fam = [];
    for (let i = 0; i < 120; i++) fam.push(mk("circle", { cx: 120 + rnd() * 1700, cy: 240 + rnd() * 640, r: 5, fill: "#4CC38A" }, "in-fam"));

    ["#in-k", "#in-ring-l", "#in-fam-l", "#in-h0", "#in-h1"].forEach((s) => gsap.set(s, { opacity: 0 }));
    tl.fromTo("#in-h0", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, {{s3h:Intelligence}} - 0.2);
    tl.fromTo("#in-h1", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, {{s3h:Every}} - 0.2);
    nEls.forEach((e) => gsap.set(e, { opacity: 0 })); eEls.forEach((e) => gsap.set(e.el, { opacity: 0 })); fam.forEach((e) => gsap.set(e, { opacity: 0 }));
    // nodes arrive by kind as they are named; edges densify; one ring lights up
    const byKind = (k) => nEls.filter((_, i) => nodes[i].kind === k);
    tl.fromTo(byKind("phone"), { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out", stagger: 0.02 }, {{s3h:number}} - 0.2);
    tl.fromTo(byKind("url"), { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.03 }, {{s3h:URL}} - 0.1);
    tl.fromTo(byKind("upi"), { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.03 }, {{s3h:UPI}} - 0.1);
    tl.to("#in-k", { opacity: 1, duration: 0.4 }, {{s3h:number}});
    tl.to(eEls.map((e) => e.el), { opacity: 1, duration: 0.35, stagger: 0.02 }, {{s3h:node}});
    tl.to(eEls.filter((e) => e.r).map((e) => e.el), { stroke: "#E5484D", strokeWidth: 3.5, duration: 0.4 }, {{s3h:rings}} - 0.3);
    tl.to(nEls.filter((_, i) => nodes[i].ring && nodes[i].kind === "phone"), { fill: "#E5484D", duration: 0.4, stagger: 0.03 }, {{s3h:rings}} - 0.3);
    tl.fromTo("#in-ring-l", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, {{s3h:rings}});
    tl.to(fam, { opacity: 1, duration: 0.3, stagger: 0.006 }, {{s3h:so}} - 0.2);
    tl.fromTo("#in-fam-l", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, {{s3h:so}} - 0.1);
    tl.to("#in-g, #in-k, #in-ring-l, #in-fam-l", { opacity: 0, duration: 0.35, ease: "power3.in" }, {{dur}} - 0.4);
    window.__timelines["intel"] = tl;
  </script>
</template>
