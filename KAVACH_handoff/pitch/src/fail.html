<template>
  <style>
    {{CSS}}
    .fl-row { left: 220px; width: 1480px; height: 150px; padding: 0 48px; display: flex; align-items: center; justify-content: space-between; }
    .fl-t { font-size: 48px; position: relative; }
    .fl-strike { position: absolute; left: -8px; right: -8px; top: 52%; height: 4px; background: #E5484D; transform-origin: left center; }
    .fl-s { font-size: 40px; }
    #fl-r0 { top: 250px; } #fl-r1 { top: 450px; } #fl-r2 { top: 650px; }
    .fl-person { top: 420px; width: 480px; height: 220px; padding: 40px 44px; }
    #fl-amma { left: 160px; } #fl-scam { left: 1280px; }
    .fl-name { font-size: 48px; } .fl-sub { font-size: 34px; margin-top: 12px; }
    #fl-gap { left: 640px; top: 528px; width: 640px; height: 4px; border-top: 4px dashed #A1A1A6; }
    #fl-slot { left: 845px; top: 415px; width: 230px; height: 230px; border-radius: 115px; border: 4px dashed #A1A1A6; }
  </style>
  <div id="root" data-composition-id="fail" data-width="1920" data-height="1080">
    <div id="fl-r0" class="abs card fl-row">
      <div class="fl-t">Awareness campaigns<div class="fl-strike" id="fl-k0"></div></div>
      <div class="fl-s red">fear takes over</div>
    </div>
    <div id="fl-r1" class="abs card fl-row">
      <div class="fl-t">Caller-ID apps<div class="fl-strike" id="fl-k1"></div></div>
      <div class="fl-s"><span class="c3">warn you ·</span> <span id="fl-act" class="red">can't act for you</span></div>
    </div>
    <div id="fl-r2" class="abs card fl-row">
      <div class="fl-t">Official helplines<div class="fl-strike" id="fl-k2"></div></div>
      <div class="fl-s"><span class="c3">golden hour</span> <span id="fl-clock" class="mono red">60:00</span></div>
    </div>
    <div id="fl-gap" class="abs"></div>
    <div id="fl-slot" class="abs"></div>
    <div id="fl-when" class="abs t2" style="left:640px; width:640px; top:690px; text-align:center; font-size:36px"><span id="fl-w0">during the call</span><span id="fl-w1"> · and right after</span></div>
    <div id="fl-amma" class="abs card fl-person">
      <div class="fl-name">Amma, 65</div>
      <div class="fl-sub c2">on a call, frightened</div>
    </div>
    <div id="fl-scam" class="abs card fl-person">
      <div class="fl-name mono red" style="font-size:40px">+91 98XXX XX210</div>
      <div class="fl-sub c2">"This is the CBI"</div>
    </div>
    <i data-sfx="minimize_002.ogg" data-at="{{s1e:Awareness}}" data-vol="0.3"></i>
    <i data-sfx="question_003.ogg" data-at="{{s1e:fail}}" data-vol="0.35"></i>
    <i data-sfx="question_003.ogg" data-at="{{s1e:gone}}" data-vol="0.35"></i>
    <i data-sfx="question_003.ogg" data-at="{{s1f:golden}}" data-vol="0.35"></i>
    <i data-sfx="minimize_004.ogg" data-at="{{s1g:Nobody}}" data-vol="0.3"></i>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const IN = (s, t, d = 0.6) => tl.fromTo(s, { opacity: 0, x: -40, filter: "blur(8px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: d, ease: "expo.out" }, t);
    const OUT = (s, t) => tl.to(s, { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power3.in" }, t);
    const STRIKE = (s, t) => tl.fromTo(s, { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.inOut" }, t);
    ["#fl-amma", "#fl-scam", "#fl-gap", "#fl-slot"].forEach((s) => gsap.set(s, { opacity: 0 }));

    IN("#fl-r0", {{s1e:Awareness}} - 0.15); STRIKE("#fl-k0", {{s1e:fail}});
    IN("#fl-r1", {{s1e:Caller}} - 0.15);
    gsap.set("#fl-act", { opacity: 0 });
    tl.fromTo("#fl-act", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, {{s1e:act}} - 0.2);
    STRIKE("#fl-k1", {{s1e:gone}});
    IN("#fl-r2", {{s1f:official}} - 0.15);
    const clk = { v: 3600 }, clkEl = document.getElementById("fl-clock");
    tl.to(clk, { v: 2472, duration: {{s1f.end}} - {{s1f:official}}, ease: "power1.in",
      onUpdate: () => { const s = Math.round(clk.v); clkEl.textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); } }, {{s1f:official}});
    STRIKE("#fl-k2", {{s1f:golden}} + 0.3);
    OUT(["#fl-r0", "#fl-r1", "#fl-r2"], {{s1g}} - 0.35);

    // nobody stands between them
    tl.fromTo("#fl-amma", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.7, ease: "expo.out" }, {{s1g:Nobody}});
    tl.fromTo("#fl-scam", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.7, ease: "expo.out" }, {{s1g:Nobody}} + 0.1);
    tl.fromTo("#fl-gap", { opacity: 0 }, { opacity: 1, duration: 0.4 }, {{s1g:between}});
    tl.fromTo("#fl-slot", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, {{s1g:between}} + 0.2);
    gsap.set(["#fl-w0", "#fl-w1"], { opacity: 0 });
    tl.fromTo("#fl-w0", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, {{s1g:during}} - 0.1);
    tl.fromTo("#fl-w1", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, {{s1g:after}} - 0.1);
    window.__timelines["fail"] = tl;
  </script>
</template>
